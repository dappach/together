<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Deary — Enter</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --b1:#02050f; --b2:#0a1e4a; --deep:#0e2352; --b3:#185fa5; --b4:#378add; --b5:#85b7eb;
    --ice:#cfe6ff; --text:#dceeff; --muted:rgba(181,212,244,0.55);
    --rose:#f4a9bd; --ease:cubic-bezier(.22,1,.36,1);
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif; color: var(--text);
    min-height: 100vh; overflow-x: hidden;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background:linear-gradient(165deg,var(--b1) 0%,#060f2b 45%,var(--deep) 100%);
  }
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 55% 40% at 50% 0%, rgba(55,138,221,0.28) 0%, transparent 65%),
      radial-gradient(ellipse 45% 35% at 12% 20%, rgba(55,138,221,0.22) 0%, transparent 65%),
      radial-gradient(ellipse 50% 60% at 88% 80%, rgba(10,30,74,0.6) 0%, transparent 65%),
      radial-gradient(ellipse 70% 40% at 50% 108%, rgba(2,5,15,0.7) 0%, transparent 65%);
  }
  .aurora { position: fixed; border-radius: 50%; filter: blur(100px); z-index: 0; pointer-events: none; opacity: .5; }
  .aurora.a1 { width: 520px; height: 520px; left: -160px; top: -160px;
    background: radial-gradient(circle, rgba(55,138,221,.35), transparent 70%);
    animation: drift1 14s ease-in-out infinite alternate; }
  .aurora.a2 { width: 460px; height: 460px; right: -140px; bottom: -140px;
    background: radial-gradient(circle, rgba(133,183,235,.2), transparent 70%);
    animation: drift2 18s ease-in-out infinite alternate; }
  @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(60px,40px) scale(1.12); } }
  @keyframes drift2 { from { transform: translate(0,0) scale(1.1); } to { transform: translate(-50px,-40px) scale(1); } }
  canvas#stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  .card {
    position: relative; z-index: 10; text-align: center; max-width: 384px; width: 100%;
    background: linear-gradient(160deg, rgba(20,40,80,.62), rgba(8,18,44,.55));
    backdrop-filter: blur(28px) saturate(1.4); -webkit-backdrop-filter: blur(28px) saturate(1.4);
    border: 1px solid rgba(160,200,245,.22); border-radius: 30px; padding: 46px 36px 38px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(55,138,221,.14),
                inset 0 1px 0 rgba(255,255,255,.14), inset 0 -18px 40px rgba(10,30,74,.35);
    opacity: 0; transform: translateY(22px);
    animation: cardIn 1s var(--ease) forwards 0.15s;
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; top: 0; left: 8%; right: 8%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
  }
  .card::after {
    content: ""; position: absolute; top: -40%; left: -20%; width: 60%; height: 80%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.06), transparent);
    transform: rotate(8deg); pointer-events: none;
  }
  @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

  .lock-wrap { position: relative; display: flex; justify-content: center; margin-bottom: 22px; }
  .lock-orbit {
    position: absolute; width: 108px; height: 108px; top: 50%; left: 50%;
    margin: -54px 0 0 -54px; border-radius: 50%; pointer-events: none;
    border: 1px solid rgba(160,200,245,.25);
    animation: orbit 12s linear infinite;
  }
  .lock-orbit::after {
    content: ""; position: absolute; top: -3px; left: 50%; width: 6px; height: 6px;
    margin-left: -3px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 10px #fff, 0 0 20px var(--b5);
  }
  @keyframes orbit { to { transform: rotate(360deg); } }
  .lock-glow {
    width: 88px; height: 88px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, rgba(207,230,255,.28), rgba(55,138,221,.14) 55%, transparent 75%),
                rgba(55,138,221,.1);
    border: 1px solid rgba(160,200,245,.3);
    box-shadow: 0 0 34px rgba(133,183,235,.35), inset 0 0 22px rgba(133,183,235,.18);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 26px rgba(133,183,235,.28), inset 0 0 22px rgba(133,183,235,.15); }
    50% { transform: scale(1.06); box-shadow: 0 0 44px rgba(133,183,235,.5), inset 0 0 26px rgba(133,183,235,.25); }
  }
  .lock-glow svg { width: 34px; height: 34px; filter: drop-shadow(0 0 8px rgba(207,230,255,.8)); }

  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(133,183,235,.09); border: 1px solid rgba(160,200,245,.3);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 50px; padding: 7px 20px;
    font-size: 0.64rem; font-weight: 600; letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--ice); margin-bottom: 20px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.1);
  }

  h2 { font-family: 'Playfair Display', serif; font-size: 1.9rem; font-weight: 700; color: #fff; margin-bottom: 8px; letter-spacing: -0.01em; }
  h2 em { font-style: italic; font-weight: 500; color: var(--ice); }
  .hint { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; color: var(--muted); font-size: 1.06rem; margin-bottom: 20px; }

  .divider { display: flex; align-items: center; gap: 12px; margin: 0 auto 24px; max-width: 220px; color: rgba(207,230,255,.6); font-size: .8rem; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(160,200,245,.5), transparent); }

  .pin-row { display: flex; gap: 12px; justify-content: center; margin-bottom: 26px; }
  .pin-box {
    width: 56px; height: 64px;
    background: linear-gradient(165deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
    border: 1px solid rgba(160,200,245,.28);
    border-radius: 17px;
    font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 600; color: #fff;
    text-align: center; outline: none; caret-color: var(--b5);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 6px 18px rgba(0,0,0,.35);
    transition: border-color .25s var(--ease), transform .2s var(--ease), background .25s var(--ease), box-shadow .25s var(--ease);
    -webkit-appearance: none; touch-action: manipulation;
  }
  .pin-box:focus { border-color: rgba(207,230,255,.8); background: rgba(55,138,221,.16); box-shadow: 0 0 0 4px rgba(133,183,235,.18), 0 0 22px rgba(133,183,235,.35); transform: translateY(-2px); }
  .pin-box.filled { border-color: rgba(207,230,255,.65); background: rgba(55,138,221,.18); box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 0 16px rgba(133,183,235,.3); }
  .pin-box.error { border-color: rgba(244,169,189,.75); box-shadow: 0 0 0 4px rgba(244,169,189,.14), 0 0 18px rgba(244,169,189,.3); }
  .pin-box.pop { animation: pop 0.3s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.16) translateY(-3px); } 100% { transform: scale(1); } }

  .enter-btn {
    position: relative; width: 100%; overflow: hidden;
    font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase; color: #fff;
    background: linear-gradient(135deg, rgba(133, 183, 235, 0.35), rgba(58, 102, 180, 0.5));
    border: 1px solid rgba(230, 198, 135, 0.4); border-radius: 50px; padding: 16px; cursor: pointer;
    box-shadow: 0 8px 26px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.16);
    transition: transform .25s var(--ease), box-shadow .25s var(--ease);
  }
  .enter-btn::after {
    content: ""; position: absolute; top: 0; left: -70%; width: 45%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
    transform: skewX(-18deg); transition: left .6s ease;
  }
  .enter-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,.46), 0 0 16px rgba(133,183,235,.22), inset 0 1px 0 rgba(255,255,255,.2); }
  .enter-btn:hover::after { left: 130%; }
  .enter-btn:active { transform: translateY(0) scale(0.98); }

  .card.shake { animation: shake 0.45s ease; }
  .card.ready { animation: none; opacity: 1; transform: translateY(0); }
  .card.ready.shake { animation: shake 0.45s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); }
    40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); }
  }

  .lock-msg {
    margin-top: 18px; font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 1.02rem; line-height: 1.55; color: var(--rose); min-height: 48px;
    opacity: 0; transition: opacity 0.4s ease;
  }
  .lock-msg.show { opacity: 1; }
  .lock-msg.ok { color: var(--ice); }

  .foot { margin-top: 20px; font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color: rgba(181,212,244,.4); }
  .foot span { color: rgba(207,230,255,.75); }

  .unlock-veil {
    position: fixed; inset: 0; z-index: 5;
    background: radial-gradient(circle at 50% 50%, rgba(133,183,235,0.35), var(--b1) 72%);
    opacity: 0; pointer-events: none; transition: opacity 0.6s ease;
  }
  .unlock-veil.show { opacity: 1; }

  @media (max-width: 420px) {
    .card { padding: 38px 24px 32px; }
    .pin-box { width: 100%; max-width: 62px; height: 60px; }
    h2 { font-size: 1.65rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .lock-glow, .lock-orbit, .pin-box, .unlock-veil, .aurora { animation: none !important; transition: none !important; }
    .card { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="aurora a1"></div>
<div class="aurora a2"></div>
<canvas id="stars"></canvas>
<div class="unlock-veil" id="veil"></div>

<div class="card" id="card">
  <div class="lock-wrap">
    <div class="lock-orbit"></div>
    <div class="lock-glow">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21s-7-4.35-9.2-8.5C1.2 8.9 3.1 5.5 6.5 5.2c1.9-.17 3.4.8 5.5 3 2.1-2.2 3.6-3.17 5.5-3 3.4.3 5.3 3.7 3.7 7.3C19 16.65 12 21 12 21z" fill="#eaf4ff" opacity="0.95"/>
      </svg>
    </div>
  </div>
  <div class="badge">✦ private space ✦</div>
  <h2>Enter <em>Passcode</em></h2>
  <div class="hint">only the two of you know this</div>
  <div class="divider">♡</div>

  <div class="pin-row" id="pinRow">
    <input class="pin-box" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 1" />
    <input class="pin-box" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2" />
    <input class="pin-box" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3" />
    <input class="pin-box" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4" />
  </div>

  <button class="enter-btn" onclick="tryUnlock()">Open ♡</button>
  <div class="lock-msg" id="lockMsg"></div>
  <div class="foot">for the two of us <span>·</span> written in the stars</div>
</div>

<script>
/* ==========================================================
   CONFIG — filled by the admin panel per order.
   ========================================================== */
const CONFIG = {
  passcode: "1403",
  redirectTo: "togetherhome.html"
};
/* ========================================================== */

const lockMessages = [
  "Ohh dear\u2026 not quite — think of our special day \uD83D\uDCAB",
  "Hmm, that wasn\u2019t it, love — take your time \u2661",
  "The stars say try again — our day is worth remembering \uD83C\uDF19",
  "Almost, my love — breathe, remember, retry \uD83D\uDC8C",
  "Not this one\u2026 but I love that you\u2019re trying \u2728",
  "Wrong key, darling \uD83D\uDD11 — our forever-day is hiding in your heart",
  "One more try, love — the moon believes in you \uD83C\uDF0C",
  "Psst\u2026 it\u2019s the day we became \u2018us\u2019 \uD83D\uDCAB"
];
const hintMessage = "Still locked\u2026 but my heart never is. It\u2019s our special date, my love \u2661";
let failCount = 0;

// canvas starfield — twinkling stars, drifting hearts, shooting stars
(function () {
  const c = document.getElementById('stars'), ctx = c.getContext('2d');
  let W, H, stars = [], hearts = [], meteors = [], glitters = [];
  function resize() { W = c.width = innerWidth; H = c.height = innerHeight; init(); }
  function init() {
    stars = []; hearts = [];
    const n = Math.min(130, Math.floor(W * H / 11000));
    for (let i = 0; i < n; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + 0.25,
        a: Math.random() * 0.7 + 0.1, da: (Math.random() - 0.5) * 0.02, big: Math.random() < 0.12 });
    }
    for (let i = 0; i < 10; i++) {
      hearts.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 9 + 7,
        vy: Math.random() * 0.22 + 0.06, ph: Math.random() * Math.PI * 2, a: Math.random() * 0.16 + 0.05 });
    }
    glitters = [];
    for (let i = 0; i < 12; i++) {
      glitters.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 0.7 + 0.5,
        ph: Math.random() * Math.PI * 2, sp: Math.random() * 0.03 + 0.012 });
    }
  }
  function spawnMeteor() {
    if (Math.random() > 0.004 || meteors.length > 2) return;
    meteors.push({ x: Math.random() * W * 0.8 + W * 0.1, y: Math.random() * H * 0.3,
      len: Math.random() * 110 + 70, speed: Math.random() * 7 + 5, life: 1 });
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    stars.forEach(s => {
      s.a += s.da;
      if (s.a <= 0.06 || s.a >= 0.85) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(170,205,245,${s.a})`;
      if (s.big) { ctx.shadowBlur = 8; ctx.shadowColor = '#cfe6ff'; } else { ctx.shadowBlur = 0; }
      ctx.fill(); ctx.shadowBlur = 0;
    });
    // glitter — slow-pulsing glow sparks with cross glints
    glitters.forEach(g => {
      g.ph += g.sp;
      const tw = Math.sin(g.ph);
      if (tw <= 0) return;
      const b = tw * tw * tw;
      const R = g.r * (1 + b * 0.9);
      ctx.save();
      ctx.globalAlpha = b;
      ctx.shadowBlur = 8; ctx.shadowColor = '#cfe6ff';
      ctx.beginPath(); ctx.arc(g.x, g.y, R, 0, Math.PI * 2);
      ctx.fillStyle = '#eaf4ff'; ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#eaf4ff'; ctx.lineWidth = 1;
      const L = R * 2.6;
      ctx.beginPath();
      ctx.moveTo(g.x - L, g.y); ctx.lineTo(g.x + L, g.y);
      ctx.moveTo(g.x, g.y - L); ctx.lineTo(g.x, g.y + L);
      ctx.stroke();
      ctx.restore();
    });
    hearts.forEach(h => {
      h.ph += 0.012; h.y -= h.vy; h.x += Math.sin(h.ph) * 0.2;
      if (h.y < -20) { h.y = H + 20; h.x = Math.random() * W; }
      const tw = h.a + Math.sin(h.ph * 2) * 0.04;
      ctx.font = `${h.s}px serif`;
      ctx.fillStyle = `rgba(207,230,255,${Math.max(0.03, tw).toFixed(3)})`;
      ctx.fillText('\u2661', h.x, h.y);
    });
    spawnMeteor();
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.speed; m.y += m.speed * 0.45; m.life -= 0.016;
      if (m.life <= 0) { meteors.splice(i, 1); continue; }
      const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.len, m.y - m.len * 0.45);
      grad.addColorStop(0, `rgba(234,244,255,${m.life})`);
      grad.addColorStop(1, 'rgba(133,183,235,0)');
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.len, m.y - m.len * 0.45);
      ctx.strokeStyle = grad; ctx.lineWidth = 1.5; ctx.stroke();
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize(); draw();
})();

// 4 real inputs — auto-advance, backspace-aware, paste-friendly
const boxes = Array.from(document.querySelectorAll('.pin-box'));

boxes.forEach((box, i) => {
  box.addEventListener('input', () => {
    box.value = box.value.replace(/\D/g, '').slice(0, 1);
    box.classList.remove('error');
    if (box.value) {
      box.classList.add('filled');
      box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
      if (i < boxes.length - 1) { boxes[i + 1].focus(); }
      else { box.blur(); setTimeout(tryUnlock, 150); }
    } else {
      box.classList.remove('filled');
    }
  });
  box.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !box.value && i > 0) {
      boxes[i - 1].focus();
      boxes[i - 1].value = '';
      boxes[i - 1].classList.remove('filled');
    }
    if (e.key === 'Enter') tryUnlock();
  });
  box.addEventListener('paste', (e) => {
    e.preventDefault();
    const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, boxes.length);
    digits.split('').forEach((d, idx) => { if (boxes[idx]) { boxes[idx].value = d; boxes[idx].classList.add('filled'); boxes[idx].classList.remove('error'); } });
    const next = boxes[digits.length] || boxes[boxes.length - 1];
    next.focus();
    if (digits.length === boxes.length) setTimeout(tryUnlock, 150);
  });
});

function getPin() { return boxes.map(b => b.value).join(''); }
function resetPin() { boxes.forEach(b => { b.value = ''; b.classList.remove('filled'); }); boxes[0].focus(); }

function tryUnlock() {
  const val = getPin();
  if (val.length < boxes.length) return;

  if (val === CONFIG.passcode) {
    sessionStorage.setItem('dearyUnlocked', '1');
    const msg = document.getElementById('lockMsg');
    msg.textContent = 'Welcome back, my love \u2661';
    msg.classList.add('show'); msg.classList.add('ok');
    document.getElementById('veil').classList.add('show');
    const card = document.getElementById('card');
    card.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
    card.style.opacity = '0';
    card.style.transform = 'scale(0.95)';
    setTimeout(() => { window.location.href = CONFIG.redirectTo; }, 800);
  } else {
    failCount++;
    const card = document.getElementById('card');
    const msg = document.getElementById('lockMsg');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    boxes.forEach(b => b.classList.add('error'));
    msg.classList.remove('ok');
    msg.textContent = (failCount % 3 === 0)
      ? hintMessage
      : lockMessages[Math.floor(Math.random() * lockMessages.length)];
    msg.classList.add('show');
    setTimeout(resetPin, 350);
  }
}

window.addEventListener('load', () => boxes[0].focus());

// once the entrance finishes, park the card in its visible state
// so the error shake can replay without hiding the card
(function () {
  const card = document.getElementById('card');
  function settle(e) {
    if (e.animationName === 'cardIn') {
      card.classList.add('ready');
      card.removeEventListener('animationend', settle);
    }
  }
  card.addEventListener('animationend', settle);
  // fallback in case animations are disabled
  setTimeout(() => card.classList.add('ready'), 1400);
})();
</script>
</body>
</html>
